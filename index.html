<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>澜汇个人信息官网</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f7fa;padding:16px}
.header{background:#3478cb;color:#fff;padding:16px;border-radius:12px;text-align:center;font-size:22px;font-weight:bold;margin-bottom:20px}
.logo-box{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.logo{width:80px;height:80px;object-fit:cover;border-radius:50%;}
.logo-text h1{font-size:32px;color:#224488}
.logo-text p{color:#555}
.tab{display:flex;margin-bottom:24px}
.tab>div{flex:1;text-align:center;padding:14px;border-radius:10px;font-size:20px;border:1px solid #ddd}
.tab .active{background:#206b82;color:#fff;border-color:#206b82}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;border:1px solid #e8e8e8}
.card h2{font-size:22px;color:#206b82;margin-bottom:16px;display:flex;align-items:center;gap:6px}
.form-item{margin-bottom:16px}
.form-item label{display:block;margin-bottom:8px;color:#444;font-size:18px}
.form-item input{width:100%;padding:14px;border:1px solid #ccc;border-radius:8px;font-size:18px}
.btn{width:100%;padding:16px;background:#206b82;color:#fff;border:none;border-radius:8px;font-size:20px}
.tip-text{margin-top:12px;color:#555;font-size:17px;line-height:1.5}
</style>
</head>
<body>
<div class="header">澜汇个人信息官网</div>

<div class="logo-box">
    <img class="logo" src="logo.png" alt="澜汇市图标">
    <div class="logo-text">
        <h1>澜汇个人信息官网</h1>
        <p>— Beijiang Citizen Cloud —</p>
    </div>
</div>

<div class="tab">
    <div>查询</div>
    <div class="active">个人</div>
</div>
<p style="margin-bottom:12px;font-size:18px;color:#444">访客</p>

<div class="card">
    <h2>→] 登录</h2>
    <div class="form-item">
        <label>用户名</label>
        <input type="text" id="username">
    </div>
    <div class="form-item">
        <label>密码</label>
        <input type="password" id="password">
    </div>
    <button class="btn" onclick="login()">→] 登录</button>
</div>

<div class="card">
    <h2>👤 个人中心</h2>
    <p class="tip-text">登录后可查看自己的完整资料、修改昵称和密码。</p>
</div>

<script>
// ========= 在这里设置你的管理员账号（只有这个账号可以编辑信息）=========
const ADMIN_USER = "李佳lj";
const ADMIN_PWD = "联机入";
// ======================================================================
function login(){
    let user = document.getElementById('username').value.trim()
    let pwd = document.getElementById('password').value.trim()
    if(!user || !pwd){
        alert("请输入用户名和密码！")
        return;
    }
    localStorage.setItem("loginUser", user);
    if(user === ADMIN_USER && pwd === ADMIN_PWD){
        alert("✅ 管理员登录成功！进入资料编辑页");
        window.location.href="edit.html";
    }else{
        alert("✅ 访客登录成功！仅可查看资料");
        window.location.href="read.html";
    }
}
</script>
</body>
</html>
