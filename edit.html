<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 - 管理员编辑资料</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f7fa;padding:16px}
.header{background:#3478cb;color:#fff;padding:16px;border-radius:12px;text-align:center;font-size:22px;font-weight:bold;margin-bottom:20px}
.logo-box{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.logo{width:80px;height:80px;object-fit:cover;border-radius:50%;}
.logo-text h1{font-size:32px;color:#224488}
.logo-text p{color:#555}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;border:1px solid #e8e8e8}
.card h2{font-size:22px;color:#206b82;margin-bottom:20px}
.form-item{margin-bottom:16px}
.form-item label{display:block;margin-bottom:8px;color:#444;font-size:18px}
.form-item input,.form-item textarea{width:100%;padding:14px;border:1px solid #ccc;border-radius:8px;font-size:18px}
.btn{width:100%;padding:16px;background:#206b82;color:#fff;border:none;border-radius:8px;font-size:20px;margin-top:10px}
.back-btn{background:#666}
</style>
</head>
<body>
<div class="header">澜汇个人信息官网｜管理员资料编辑</div>

<div class="logo-box">
    <img class="logo" src="logo.png" alt="澜汇图标">
    <div class="logo-text">
        <h1>澜汇个人信息官网</h1>
        <p>— Beijiang Citizen Cloud —</p>
    </div>
</div>

<div class="card">
    <h2>编辑个人信息（管理员权限）</h2>
    <div class="form-item">
        <label>昵称</label>
        <input type="text" id="nickname">
    </div>
    <div class="form-item">
        <label>手机号</label>
        <input type="text" id="phone">
    </div>
    <div class="form-item">
        <label>个人简介</label>
        <textarea id="desc" rows="4"></textarea>
    </div>
    <div class="form-item">
        <label>新密码（留空不修改）</label>
        <input type="password" id="newpwd">
    </div>
    <button class="btn" onclick="saveInfo()">保存修改</button>
    <button class="btn back-btn" onclick="window.location.href='index.html'">返回登录页</button>
</div>

<script>
window.onload = function(){
    // 加载已经保存的信息
    if(localStorage.getItem('nickname')){
        document.getElementById('nickname').value = localStorage.getItem('nickname')
    }
    if(localStorage.getItem('phone')){
        document.getElementById('phone').value = localStorage.getItem('phone')
    }
    if(localStorage.getItem('desc')){
        document.getElementById('desc').value = localStorage.getItem('desc')
    }
}
function saveInfo(){
    let nick = document.getElementById('nickname').value
    let phone = document.getElementById('phone').value
    let desc = document.getElementById('desc').value
    localStorage.setItem('nickname',nick)
    localStorage.setItem('phone',phone)
    localStorage.setItem('desc',desc)
    alert("✅ 资料保存成功！访客刷新页面就能看到更新后的内容");
}
</script>
</body>
</html>
